  <script>
    /* Kitsune Analytics owner opt-out.
       Open once with ?kitsune_owner=1 on your own device to exclude it.
       Use ?kitsune_owner=0 to re-enable analytics on that device. */
    (() => {
      const KEY="a8_analytics_owner_optout";
      try{
        const u=new URL(location.href);
        const v=u.searchParams.get("kitsune_owner");
        if(v==="1")localStorage.setItem(KEY,"1");
        if(v==="0")localStorage.removeItem(KEY);
        if(v==="1"||v==="0"){
          u.searchParams.delete("kitsune_owner");
          history.replaceState(history.state,"",u.pathname+(u.search||"")+(u.hash||""));
        }
      }catch(e){}
      window.kitsuneAnalyticsBeforeSend=(type,payload)=>{
        try{
          if(localStorage.getItem(KEY)==="1")return false;
        }catch(e){}
        return payload;
      };
    })();
  </script>

    data-exclude-search="true"
    data-performance="true"
    data-before-send="kitsuneAnalyticsBeforeSend"></script>
