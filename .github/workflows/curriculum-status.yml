name: Проверка официальных источников

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/curriculum-status.yml'
      - 'tools/curriculum/**'
      - 'curriculum-sources-v302.js'

concurrency:
  group: kitsune-curriculum-report
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Получить исходники
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Подготовить Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Проверить сборщик и публикацию отчёта
        run: node --test tests/curriculum-checker.test.cjs tests/curriculum-publisher.test.cjs
      - name: Прочитать предыдущую проверку
        run: node tools/curriculum/publish-report.cjs prepare
      - name: Проверить страницы ЕДСОО и ФИПИ
        run: node tools/curriculum/check-sources.cjs --previous .curriculum-report/previous.json --output .curriculum-report/curriculum-status.json
      - name: Опубликовать только отчёт в отдельной ветке
        run: node tools/curriculum/publish-report.cjs publish
